document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pp-ui\" style=\"min-height:100vh;background:#ECE2D0;font-family:'Lato',sans-serif;color:#3A3335;padding-bottom:60px;\">\n\n  <div style=\"background:#471E30;color:#F6F1E9;padding:26px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;\">\n    <div>\n      <div style=\"font-family:'Lato',sans-serif;font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:#D9A9AB;margin-bottom:8px;\">PRONAM · Riesgo obstétrico<\u002Fdiv>\n      <h1 style=\"font-family:'Gelasio',serif;font-weight:600;font-size:34px;margin:0;line-height:1;\">Calculadora del Índice de Coopland<\u002Fh1>\n    <\u002Fdiv>\n    <div class=\"no-print\" style=\"display:flex;gap:12px;\">\n      <button sc-camel-on-click=\"{{ onPrint }}\" style=\"cursor:pointer;font-family:'Lato',sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;border:1.5px solid rgba(236,226,208,.5);background:transparent;color:#F6F1E9;border-radius:9px;padding:11px 20px;\" style-hover=\"background:rgba(236,226,208,.14);\">Imprimir<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onReset }}\" style=\"cursor:pointer;font-family:'Lato',sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;border:none;background:#A26769;color:#F6F1E9;border-radius:9px;padding:11px 20px;\" style-hover=\"background:#8f5658;\">Limpiar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1200px;margin:0 auto;padding:30px 28px 0;\">\n\n    <!-- DATOS DE LA PACIENTE -->\n    <div style=\"background:#fff;border-radius:16px;padding:30px 34px 34px;box-shadow:0 12px 30px rgba(71,30,48,.08);margin-bottom:26px;\">\n      <div style=\"font-family:'Gelasio',serif;font-size:26px;font-weight:600;color:#471E30;margin-bottom:22px;\">Datos de la paciente<\u002Fdiv>\n\n      <div style=\"margin-bottom:20px;\">\n        <label style=\"display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#A26769;margin-bottom:8px;\">Nombre completo de la paciente<\u002Flabel>\n        <input type=\"text\" value=\"{{ nombre }}\" sc-camel-on-input=\"{{ onNombre }}\" placeholder=\"Apellido paterno · Apellido materno · Nombre(s)\" style=\"width:100%;border:1.5px solid #dcc9b4;border-radius:10px;padding:15px 18px;font-family:'Lato',sans-serif;font-size:20px;color:#3A3335;background:#fdfbf7;outline:none;\" style-focus=\"border-color:#471E30;background:#fff;\">\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;\">\n        <div style=\"flex:2 1 380px;min-width:260px;\">\n          <label style=\"display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#A26769;margin-bottom:8px;\">Número de expediente<\u002Flabel>\n          <input type=\"text\" value=\"{{ expediente }}\" sc-camel-on-input=\"{{ onExpediente }}\" placeholder=\"Ej. ISSSTE-000-000-00\" style=\"width:100%;border:1.5px solid #dcc9b4;border-radius:10px;padding:15px 18px;font-family:'Lato',sans-serif;font-size:20px;letter-spacing:.02em;color:#3A3335;background:#fdfbf7;outline:none;\" style-focus=\"border-color:#471E30;background:#fff;\">\n        <\u002Fdiv>\n        <div style=\"flex:1 1 180px;min-width:150px;\">\n          <label style=\"display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#A26769;margin-bottom:8px;\">Fecha<\u002Flabel>\n          <input type=\"date\" value=\"{{ fecha }}\" sc-camel-on-input=\"{{ onFecha }}\" style=\"width:100%;border:1.5px solid #dcc9b4;border-radius:10px;padding:13px 16px;font-family:'Lato',sans-serif;font-size:16px;color:#3A3335;background:#fdfbf7;outline:none;\" style-focus=\"border-color:#471E30;background:#fff;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;\">\n        <div style=\"flex:1 1 160px;min-width:140px;\">\n          <label style=\"display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#A26769;margin-bottom:8px;\">Edad gestacional (SDG)<\u002Flabel>\n          <input type=\"text\" value=\"{{ sdg }}\" sc-camel-on-input=\"{{ onSdg }}\" placeholder=\"Ej. 24.3\" style=\"width:100%;border:1.5px solid #dcc9b4;border-radius:10px;padding:13px 16px;font-family:'Lato',sans-serif;font-size:16px;color:#3A3335;background:#fdfbf7;outline:none;\" style-focus=\"border-color:#471E30;background:#fff;\">\n        <\u002Fdiv>\n        <div style=\"flex:1.4 1 220px;min-width:180px;\">\n          <label style=\"display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#A26769;margin-bottom:8px;\">Unidad / servicio<\u002Flabel>\n          <input type=\"text\" value=\"{{ unidad }}\" sc-camel-on-input=\"{{ onUnidad }}\" placeholder=\"Consulta externa GyO\" style=\"width:100%;border:1.5px solid #dcc9b4;border-radius:10px;padding:13px 16px;font-family:'Lato',sans-serif;font-size:16px;color:#3A3335;background:#fdfbf7;outline:none;\" style-focus=\"border-color:#471E30;background:#fff;\">\n        <\u002Fdiv>\n        <div style=\"flex:1.4 1 220px;min-width:180px;\">\n          <label style=\"display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#A26769;margin-bottom:8px;\">Evaluó<\u002Flabel>\n          <input type=\"text\" value=\"{{ evaluador }}\" sc-camel-on-input=\"{{ onEvaluador }}\" placeholder=\"Nombre del profesional\" style=\"width:100%;border:1.5px solid #dcc9b4;border-radius:10px;padding:13px 16px;font-family:'Lato',sans-serif;font-size:16px;color:#3A3335;background:#fdfbf7;outline:none;\" style-focus=\"border-color:#471E30;background:#fff;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- FORM + RESULT -->\n    <div class=\"coop-grid\" style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;\">\n\n      <div style=\"flex:1 1 560px;min-width:320px;display:flex;flex-direction:column;gap:22px;\">\n        <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"4\">\n          <div style=\"background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(71,30,48,.07);overflow:hidden;\">\n            <div style=\"background:#6D2E46;color:#F6F1E9;padding:16px 26px;font-family:'Lato',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;\">{{ sec.title }}<\u002Fdiv>\n            <div style=\"padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px;\">\n              <sc-for list=\"{{ sec.rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n\n                <sc-if value=\"{{ row.isGroup }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:6px 2px 10px;\">\n                    <div style=\"font-family:'Lato',sans-serif;font-weight:800;font-size:15px;color:#471E30;margin-bottom:10px;\">{{ row.label }}<\u002Fdiv>\n                    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n                      <sc-for list=\"{{ row.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                        <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\">\n                          <span>{{ o.label }}<\u002Fspan>\n                          <span style=\"{{ o.ptsStyle }}\">{{ o.ptsLabel }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ row.isCheck }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div sc-camel-on-click=\"{{ row.onToggle }}\" style=\"{{ row.rowStyle }}\">\n                    <div style=\"{{ row.boxStyle }}\">{{ row.mark }}<\u002Fdiv>\n                    <div style=\"flex:1;font-family:'Lato',sans-serif;font-size:16px;font-weight:400;color:#3A3335;line-height:1.3;\">{{ row.label }}<\u002Fdiv>\n                    <span style=\"{{ row.ptsStyle }}\">{{ row.ptsLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div class=\"coop-result\" style=\"flex:1 1 330px;min-width:300px;position:sticky;top:20px;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(71,30,48,.12);overflow:hidden;\">\n        <div style=\"background:#471E30;color:#F6F1E9;padding:18px 26px;font-family:'Lato',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;\">Resultado<\u002Fdiv>\n        <div style=\"padding:30px 28px 26px;\">\n\n          <div style=\"{{ circleStyle }}\">\n            <div style=\"font-family:'Gelasio',serif;font-size:56px;font-weight:700;line-height:.85;\">{{ total }}<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-top:2px;\">puntos<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"text-align:center;margin-top:20px;\">\n            <div style=\"font-family:'Gelasio',serif;font-size:30px;font-weight:700;color:{{ catColor }};line-height:1;\">{{ catLabel }}<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:15px;font-weight:700;color:#8a7a70;margin-top:6px;\">{{ catRange }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:22px 0 4px;display:flex;gap:8px;\">\n            <sc-for list=\"{{ risks }}\" as=\"rk\" hint-placeholder-count=\"3\">\n              <div style=\"{{ rk.style }}\">\n                <div style=\"font-family:'Lato',sans-serif;font-weight:800;font-size:14px;\">{{ rk.n }}<\u002Fdiv>\n                <div style=\"font-family:'Lato',sans-serif;font-size:12px;opacity:.8;margin-top:2px;\">{{ rk.r }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:20px;background:{{ catBg }};border-radius:11px;padding:16px 18px;\">\n            <div style=\"font-family:'Lato',sans-serif;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{ catColor }};margin-bottom:11px;\">Conducta sugerida<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;\">\n              <sc-for list=\"{{ catConducta }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:10px;align-items:flex-start;\">\n                  <div style=\"flex:none;width:7px;height:7px;border-radius:50%;background:{{ catColor }};margin-top:7px;\"><\u002Fdiv>\n                  <div style=\"flex:1;font-family:'Lato',sans-serif;font-size:15px;font-weight:400;color:#3A3335;line-height:1.4;\">{{ c }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px;background:#F6E9E0;border-left:4px solid #640604;border-radius:0 9px 9px 0;padding:13px 16px;font-family:'Lato',sans-serif;font-size:14px;color:#471E30;line-height:1.4;\">El puntaje <b>no sustituye el juicio clínico<\u002Fb>: una sola complicación grave obliga a la referencia, sin importar el total.<\u002Fdiv>\n\n          <div style=\"margin-top:18px;font-family:'Lato',sans-serif;font-size:11px;color:#a99a8c;line-height:1.5;\">Puntaje: Coopland A.J. et al. (1977), <i>Can Med Assoc J<\u002Fi>. Conducta según PRONAM — Villasís-Keever M.Á. (2025), NOM-007-SSA2-2016 y recomendaciones OMS.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== HOJA DE IMPRESIÓN (solo al imprimir) ===== -->\n<div class=\"print-sheet\" style=\"font-family:'Lato',sans-serif;color:#3A3335;width:100%;\">\n\n  <div style=\"display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid #471E30;padding-bottom:8px;margin-bottom:12px;\">\n    <div>\n      <div style=\"font-family:'Lato',sans-serif;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:9.5px;color:#A26769;margin-bottom:3px;\">PRONAM · Riesgo obstétrico<\u002Fdiv>\n      <div style=\"font-family:'Gelasio',serif;font-weight:700;font-size:22px;color:#471E30;line-height:1.05;\">Índice de Coopland<\u002Fdiv>\n      <div style=\"font-family:'Lato',sans-serif;font-size:11px;color:#8a7a70;margin-top:2px;\">Evaluación del riesgo obstétrico<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;font-family:'Lato',sans-serif;font-size:11.5px;color:#3A3335;line-height:1.5;min-width:130px;\">\n      <div><span style=\"color:#A26769;font-weight:700;\">Fecha:<\u002Fspan> {{ fechaImp }}<\u002Fdiv>\n      <div><span style=\"color:#A26769;font-weight:700;\">SDG:<\u002Fspan> {{ sdgImp }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-family:'Lato',sans-serif;font-size:13px;margin-bottom:12px;\">\n    <sc-raw-tbody>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:4px 0;color:#A26769;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10px;width:140px;vertical-align:top;\">Paciente<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:4px 0;font-weight:700;font-size:15px;color:#471E30;border-bottom:1px solid #e6dccc;\">{{ nombreImp }}<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:4px 0;color:#A26769;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10px;vertical-align:top;\">Expediente<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:4px 0;font-weight:700;font-size:15px;letter-spacing:.02em;color:#471E30;border-bottom:1px solid #e6dccc;\">{{ expedienteImp }}<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:4px 0;color:#A26769;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10px;vertical-align:top;\">Unidad / servicio<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:4px 0;font-size:13px;color:#3A3335;border-bottom:1px solid #e6dccc;\">{{ unidadImp }}<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <div style=\"display:flex;gap:14px;align-items:stretch;margin-bottom:12px;\">\n    <div style=\"flex:none;width:120px;border-radius:10px;background:{{ catBg }};border:2px solid {{ catColor }};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;\">\n      <div style=\"font-family:'Gelasio',serif;font-size:40px;font-weight:700;line-height:.9;color:{{ catColor }};\">{{ total }}<\u002Fdiv>\n      <div style=\"font-family:'Lato',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{ catColor }};opacity:.85;\">puntos<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-radius:10px;background:{{ catBg }};border:2px solid {{ catColor }};padding:10px 16px;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"font-family:'Lato',sans-serif;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{ catColor }};\">Clasificación de riesgo<\u002Fdiv>\n      <div style=\"font-family:'Gelasio',serif;font-size:26px;font-weight:700;color:{{ catColor }};line-height:1.05;margin:1px 0 2px;\">{{ catLabel }}<\u002Fdiv>\n      <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;font-weight:700;color:#8a7a70;\">{{ catRange }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ tieneFactores }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-bottom:12px;\">\n      <div style=\"font-family:'Lato',sans-serif;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#A26769;margin-bottom:5px;\">Factores que contribuyen al puntaje<\u002Fdiv>\n      <div style=\"border:1px solid #e6dccc;border-radius:8px;overflow:hidden;\">\n        <sc-for list=\"{{ factoresImp }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 12px;border-bottom:1px solid #f0e8db;font-family:'Lato',sans-serif;font-size:12.5px;\">\n            <span style=\"color:#3A3335;\">{{ f.label }}<\u002Fspan>\n            <span style=\"font-weight:800;color:#8f2320;flex:none;\">+{{ f.pts }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"margin-bottom:12px;\">\n    <div style=\"font-family:'Lato',sans-serif;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#A26769;margin-bottom:6px;\">Conducta sugerida<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n      <sc-for list=\"{{ catConducta }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;gap:8px;align-items:flex-start;\">\n          <div style=\"flex:none;width:5px;height:5px;border-radius:50%;background:{{ catColor }};margin-top:6px;\"><\u002Fdiv>\n          <div style=\"flex:1;font-family:'Lato',sans-serif;font-size:12px;font-weight:400;color:#3A3335;line-height:1.35;\">{{ c }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F6E9E0;border-left:3px solid #640604;border-radius:0 6px 6px 0;padding:8px 12px;font-family:'Lato',sans-serif;font-size:11.5px;color:#471E30;line-height:1.35;margin-bottom:26px;\">El puntaje <b>no sustituye el juicio clínico<\u002Fb>: una sola complicación grave obliga a la referencia, sin importar el total.<\u002Fdiv>\n\n  <div style=\"margin:0 auto;max-width:430px;border-top:1.5px solid #3A3335;padding-top:7px;text-align:center;\">\n    <div style=\"font-family:'Lato',sans-serif;font-size:13px;font-weight:700;color:#471E30;\">{{ medicoImp }}<\u002Fdiv>\n    <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#8a7a70;margin-top:3px;\">Nombre, firma y cédula profesional del médico<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:16px;border-top:1px solid #e6dccc;padding-top:7px;font-family:'Lato',sans-serif;font-size:9px;color:#a99a8c;line-height:1.45;\">Puntaje: Coopland A.J. et al. (1977), <i>Can Med Assoc J<\u002Fi>. Conducta según PRONAM — Villasís-Keever M.Á. (2025), NOM-007-SSA2-2016 y recomendaciones OMS.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    patient: { nombre:'', expediente:'', fecha:'', sdg:'', unidad:'', evaluador:'' },\n    radios: {},\n    checks: {}\n  };\n\n  componentDidMount(){\n    try {\n      const raw = localStorage.getItem('coopland-calc-v1');\n      if (raw) {\n        const s = JSON.parse(raw);\n        this.setState({\n          patient: Object.assign({ nombre:'', expediente:'', fecha:'', sdg:'', unidad:'', evaluador:'' }, s.patient||{}),\n          radios: s.radios || {},\n          checks: s.checks || {}\n        });\n      }\n    } catch(e) {}\n  }\n\n  persist(next){ try { localStorage.setItem('coopland-calc-v1', JSON.stringify(next)); } catch(e) {} }\n\n  setPatient(key, val){\n    this.setState(s => { const next = { ...s, patient: { ...s.patient, [key]: val } }; this.persist(next); return next; });\n  }\n  setRadio(key, val){\n    this.setState(s => {\n      const radios = { ...s.radios };\n      if (radios[key] === val) delete radios[key]; else radios[key] = val;\n      const next = { ...s, radios }; this.persist(next); return next;\n    });\n  }\n  toggleCheck(id){\n    this.setState(s => {\n      const checks = { ...s.checks };\n      if (checks[id]) delete checks[id]; else checks[id] = true;\n      const next = { ...s, checks }; this.persist(next); return next;\n    });\n  }\n  reset(){\n    const next = { patient:{ nombre:'', expediente:'', fecha:'', sdg:'', unidad:'', evaluador:'' }, radios:{}, checks:{} };\n    this.persist(next); this.setState(next);\n  }\n\n  fmtFecha(v){\n    if (!v) return '—';\n    const p = v.split('-');\n    if (p.length !== 3) return v;\n    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\n    const m = parseInt(p[1], 10) - 1;\n    return parseInt(p[2], 10) + ' ' + (meses[m] || p[1]) + ' ' + p[0];\n  }\n\n  getConfig(){\n    return [\n      { title:'Factor de riesgo', rows:[\n        { type:'group', key:'edad', label:'Edad (años)', options:[['lt18','Menos de 18',2],['mid','Entre 18 y 35',0],['gt35','Más de 35',2]] },\n        { type:'group', key:'paridad', label:'Paridad', options:[['nul','Nulípara',1],['p14','1 a 4',0],['gt5','Más de 5',2]] }\n      ]},\n      { title:'Condiciones médicas y quirúrgicas', rows:[\n        { type:'check', id:'htac', label:'Hipertensión arterial crónica', pts:2 },\n        { type:'check', id:'dmpre', label:'Diabetes pregestacional', pts:2 },\n        { type:'check', id:'erc', label:'Enfermedad renal crónica', pts:2 },\n        { type:'check', id:'card34', label:'Cardiopatía (NYHA III o IV)', pts:3 },\n        { type:'check', id:'card12', label:'Cardiopatía (NYHA I o II)', pts:1 },\n        { type:'check', id:'cxgin', label:'Cirugía ginecológica previa', pts:2 },\n        { type:'group', key:'padecimiento', label:'Otro padecimiento médico (asma, epilepsia, Tb…)', options:[['no','Ninguno',0],['leve','Leve',1],['mod','Moderado',2],['grave','Grave',3]] }\n      ]},\n      { title:'Antecedentes obstétricos', rows:[\n        { type:'check', id:'infertilidad', label:'Infertilidad', pts:1 },\n        { type:'check', id:'abortos1', label:'Dos o más abortos del primer trimestre', pts:1 },\n        { type:'check', id:'abortos2', label:'Dos o más abortos del segundo trimestre', pts:2 },\n        { type:'check', id:'rnpeso', label:'RN previo menor a 2500 g o mayor a 4000 g', pts:1 },\n        { type:'check', id:'cesarea', label:'Cesárea previa', pts:1 },\n        { type:'check', id:'hpp', label:'Hemorragia postparto o transfusión previa', pts:1 },\n        { type:'check', id:'muertefetal', label:'Muerte fetal o muerte neonatal previa', pts:3 },\n        { type:'check', id:'distocia', label:'Distocia o trabajo de parto prolongado', pts:2 },\n        { type:'check', id:'htagest', label:'Hipertensión gestacional o preeclampsia previa', pts:2 },\n        { type:'check', id:'eclampsiaprev', label:'Eclampsia previa', pts:3 },\n        { type:'check', id:'dmgestprev', label:'Diabetes gestacional previa', pts:2 }\n      ]},\n      { title:'Condiciones en el embarazo actual', rows:[\n        { type:'check', id:'sangradoa', label:'Sangrado vaginal antes de las 20 SDG', pts:1 },\n        { type:'check', id:'sangradod', label:'Sangrado vaginal después de las 20 SDG', pts:3 },\n        { type:'group', key:'anemia', label:'Anemia', options:[['no','Sin anemia',0],['hb610','Hb 6–10 g/L',1],['hb6','Hb menor a 6 g/L',2]] },\n        { type:'check', id:'rh', label:'Aloinmunización Rh', pts:3 },\n        { type:'check', id:'nocefalica', label:'No presentación cefálica al término', pts:3 },\n        { type:'check', id:'multiple', label:'Embarazo múltiple', pts:3 },\n        { type:'check', id:'hta', label:'Hipertensión', pts:3 },\n        { type:'check', id:'eclampsia', label:'Eclampsia', pts:3 },\n        { type:'check', id:'dmgest', label:'Diabetes gestacional', pts:2 },\n        { type:'check', id:'placenta', label:'Placenta previa', pts:2 },\n        { type:'check', id:'rpm', label:'Ruptura prematura de membranas (a término)', pts:2 },\n        { type:'check', id:'rpmpre', label:'Ruptura prematura de membranas pretérmino', pts:3 },\n        { type:'check', id:'polih', label:'Polihidramnios', pts:2 },\n        { type:'check', id:'oligoh', label:'Oligohidramnios', pts:2 },\n        { type:'check', id:'pfp10', label:'Peso fetal menor al percentil 10', pts:3 },\n        { type:'check', id:'doppler', label:'Ultrasonido Doppler alterado', pts:3 }\n      ]}\n    ];\n  }\n\n  badge(pts){\n    const base = 'display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:4px 10px;border-radius:20px;font-family:Lato,sans-serif;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none;';\n    let col;\n    if (pts >= 3) col = 'background:#f3dad9;color:#8f2320;';\n    else if (pts === 2) col = 'background:#f7e6cf;color:#a35a17;';\n    else if (pts === 1) col = 'background:#eddfca;color:#7d5a2e;';\n    else col = 'background:#e6e0d6;color:#8a8378;';\n    return base + col;\n  }\n  chipBadge(active, pts){\n    const base = 'display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:3px 9px;border-radius:16px;font-family:Lato,sans-serif;font-weight:800;font-size:12px;flex:none;';\n    if (active) return base + 'background:rgba(246,241,233,.2);color:#F6F1E9;';\n    return base + this.badge(pts).replace('display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:4px 10px;border-radius:20px;font-family:Lato,sans-serif;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none;','');\n  }\n  chipStyle(active){\n    const base = 'flex:1 1 0;min-width:0;cursor:pointer;border-radius:11px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:Lato,sans-serif;font-size:15px;font-weight:700;line-height:1.15;text-align:center;transition:all .12s;';\n    return base + (active\n      ? 'border:1.5px solid #471E30;background:#471E30;color:#F6F1E9;box-shadow:0 6px 16px rgba(71,30,48,.22);'\n      : 'border:1.5px solid #dcc9b4;background:#fff;color:#471E30;');\n  }\n  rowStyle(active){\n    const base = 'display:flex;align-items:center;gap:14px;padding:11px 15px;border-radius:10px;cursor:pointer;transition:all .12s;user-select:none;';\n    return base + (active\n      ? 'background:#f5e9df;border:1.5px solid #A26769;'\n      : 'background:#faf6f0;border:1.5px solid #efe4d6;');\n  }\n  boxStyle(active){\n    const base = 'flex:none;width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;transition:all .12s;';\n    return base + (active\n      ? 'background:#471E30;border:1.5px solid #471E30;color:#F6F1E9;'\n      : 'background:#fff;border:1.5px solid #c9b49c;color:transparent;');\n  }\n  segStyle(active, color){\n    const base = 'flex:1;text-align:center;border-radius:9px;padding:10px 6px;transition:all .12s;';\n    return base + (active\n      ? 'background:' + color + ';color:#fff;'\n      : 'background:#f1e7da;color:#9c8f7f;');\n  }\n\n  renderVals(){\n    const s = this.state;\n    const cfg = this.getConfig();\n    let total = 0;\n    const selected = [];\n\n    const sections = cfg.map(sec => {\n      const rows = sec.rows.map(row => {\n        if (row.type === 'group') {\n          const cur = s.radios[row.key];\n          const options = row.options.map(o => {\n            const active = cur === o[0];\n            if (active) { total += o[2]; if (o[2] > 0) selected.push({ label: row.label + ': ' + o[1], pts: o[2] }); }\n            return {\n              label: o[1],\n              ptsLabel: o[2] > 0 ? '+' + o[2] : '0',\n              style: this.chipStyle(active),\n              ptsStyle: this.chipBadge(active, o[2]),\n              onSelect: () => this.setRadio(row.key, o[0])\n            };\n          });\n          return { isGroup: true, isCheck: false, label: row.label, options };\n        } else {\n          const active = !!s.checks[row.id];\n          if (active) { total += row.pts; selected.push({ label: row.label, pts: row.pts }); }\n          return {\n            isGroup: false, isCheck: true,\n            label: row.label,\n            ptsLabel: '+' + row.pts,\n            mark: active ? '✓' : '',\n            rowStyle: this.rowStyle(active),\n            boxStyle: this.boxStyle(active),\n            ptsStyle: this.badge(row.pts),\n            onToggle: () => this.toggleCheck(row.id)\n          };\n        }\n      });\n      return { title: sec.title, rows };\n    });\n\n    const CATS = [\n      { short:'Bajo', label:'Riesgo bajo', range:'0 – 3 puntos', srange:'0–3', color:'#2f6b3a', bg:'#e7f0e5', conducta:[\n        'Control prenatal en el primer nivel de atención por medicina familiar o general.',\n        'Esquema de contactos prenatales conforme a la NOM-007-SSA2-2016; reclasificar el riesgo en cada consulta.',\n        'Suplementación con ácido fólico y hierro; solicitar laboratorios y ultrasonido de rutina por trimestre.',\n        'Detección oportuna de diabetes gestacional (tamiz 24–28 SDG) y de preeclampsia (toma de tensión arterial y proteinuria en cada consulta).',\n        'Educación en signos y síntomas de alarma obstétrica, lactancia y elaboración del plan de parto y de emergencia.',\n        'Promover estilo de vida saludable: alimentación, actividad física, cese de tabaco/alcohol y salud bucal.',\n        'Aplicar vacunas indicadas en el embarazo (Tdpa, influenza) y consejería en planificación familiar posparto.'\n      ] },\n      { short:'Moderado', label:'Riesgo moderado', range:'4 – 6 puntos', srange:'4–6', color:'#a35a17', bg:'#f7ecdb', conducta:[\n        'Vigilancia estrecha con consultas más frecuentes; interconsulta o envío a segundo nivel (Ginecología y Obstetricia).',\n        'Estudios dirigidos al factor identificado: ultrasonido, curva de tolerancia a la glucosa, perfil de preeclampsia, etc.',\n        'Profilaxis según indicación: ácido acetilsalicílico y calcio ante riesgo de preeclampsia; control estricto de glucemia o cifras tensionales.',\n        'Elaborar plan de seguridad y de referencia oportuna; documentar signos de alarma y la conducta ante cada uno.',\n        'Vigilancia del crecimiento y bienestar fetal según el factor (ultrasonido seriado, monitoreo).',\n        'Definir la atención del parto en una unidad con capacidad resolutiva; reclasificar el riesgo en cada consulta y reevaluar ante toda nueva complicación.',\n        'Coordinar la contrarreferencia al primer nivel una vez controlado o resuelto el factor de riesgo.'\n      ] },\n      { short:'Alto', label:'Riesgo alto', range:'≥ 7 puntos', srange:'≥7', color:'#8f2320', bg:'#f3dad9', conducta:[\n        'Referencia a tercer nivel de atención / clínica de medicina materno-fetal, con manejo multidisciplinario.',\n        'Vigilancia fetal intensiva: ultrasonido y Doppler seriados, perfil biofísico y registro cardiotocográfico según el caso.',\n        'Atención del parto programada en unidad con banco de sangre, UCI de adultos y UCIN; activar Código Mater / equipo de respuesta ante urgencia obstétrica.',\n        'Individualizar la vía y el momento de interrupción del embarazo; administrar maduración pulmonar y neuroprotección fetal cuando corresponda.',\n        'Garantizar traslado seguro con personal capacitado (sistema de referencia–contrarreferencia) y comunicación previa con la unidad receptora.',\n        'Establecer plan anticipado ante hemorragia, crisis hipertensiva y sepsis; consejería y consentimiento informado a la paciente y familia.',\n        'Seguimiento estrecho del puerperio y planificación reproductiva; considerar anticoncepción de alta eficacia.'\n      ] }\n    ];\n    const catIdx = total <= 3 ? 0 : (total <= 6 ? 1 : 2);\n    const cat = CATS[catIdx];\n\n    const circleStyle = 'width:124px;height:124px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;background:' + cat.bg + ';border:6px solid ' + cat.color + ';color:' + cat.color + ';';\n\n    const risks = CATS.map((c, i) => ({ n: c.short, r: c.srange, style: this.segStyle(i === catIdx, c.color) }));\n\n    return {\n      nombre: s.patient.nombre, expediente: s.patient.expediente, fecha: s.patient.fecha,\n      sdg: s.patient.sdg, unidad: s.patient.unidad, evaluador: s.patient.evaluador,\n      onNombre: e => this.setPatient('nombre', e.target.value),\n      onExpediente: e => this.setPatient('expediente', e.target.value),\n      onFecha: e => this.setPatient('fecha', e.target.value),\n      onSdg: e => this.setPatient('sdg', e.target.value),\n      onUnidad: e => this.setPatient('unidad', e.target.value),\n      onEvaluador: e => this.setPatient('evaluador', e.target.value),\n      sections,\n      total,\n      circleStyle,\n      catColor: cat.color, catBg: cat.bg, catLabel: cat.label, catRange: cat.range, catConducta: cat.conducta,\n      nombreImp: (s.patient.nombre || '').trim() || '—',\n      expedienteImp: (s.patient.expediente || '').trim() || '—',\n      unidadImp: (s.patient.unidad || '').trim() || '—',\n      medicoImp: (s.patient.evaluador || '').trim() || '\\u00A0',\n      sdgImp: (s.patient.sdg || '').trim() || '—',\n      fechaImp: this.fmtFecha(s.patient.fecha),\n      factoresImp: selected,\n      tieneFactores: selected.length > 0,\n      risks,\n      onReset: () => this.reset(),\n      onPrint: () => window.print()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
